# Configuracion de Fly.io (https://fly.io) para el Kiosco Exodo.
#
# Pasos (con flyctl instalado y sesion iniciada):
#   1) fly launch --no-deploy        (deja este archivo; o: fly apps create kiosco-exodo)
#   2) fly volumes create kiosco_data --size 1 --region mia
#   3) fly deploy
#
# Cambia el nombre de la app y la region si quieres.

app = "kiosco-exodo"
primary_region = "mia"

[build]

[env]
  PORT = "3000"
  # Carpeta de datos = el volumen persistente (asi los pedidos NO se pierden)
  DATA_DIR = "/data"

# Disco persistente donde vive store.json
[[mounts]]
  source = "kiosco_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
